<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>English Flashcards Track UI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  :root {
    --primary-blue: #6DA7F2;
    --bg-blue-light: rgba(109, 167, 242, 0.15);
    --delete-red: #d9534f;
    --bookmark-orange: #ff9800;
  }

  body {
    font-family: 'Pretendard', sans-serif;
    padding: 30px;
    max-width: 900px;
    margin: auto;
  }

  h1 { text-align: center; color: var(--primary-blue); margin-bottom: 30px; }

  button, input, table, th, td {
    border: 1px solid var(--primary-blue) !important;
  }

  .controls { text-align: center; margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

  button {
    background-color: var(--bg-blue-light);
    color: var(--primary-blue);
    padding: 10px 20px;
    cursor: pointer;
    border-radius: 6px;
    font-weight: bold;
    transition: 0.2s;
  }
  button:hover { background-color: var(--primary-blue); color: white; }

  .start-btn {
    background-color: var(--primary-blue);
    color: white;
  }
  .start-btn:hover { background-color: #4d8de0; }

  .input-row { display: flex; gap: 10px; margin-bottom: 30px; }
  input { flex: 1; padding: 12px; border-radius: 4px; outline: none; }

  /* 테이블 컨테이너: 좌우 아이콘 공간 확보 (좌측은 북마크+복습일 배지 두 칸 확보) */
  .table-container { 
    position: relative; 
    margin: 0 60px 0 118px;
  }
  
  /* 섞기 버튼 (테이블 왼쪽 상단) */
  .shuffle-btn {
    position: absolute;
    left: -118px;
    top: 0;
    width: 118px;
    height: 45.5px; /* 헤더 높이와 맞춤 */
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-blue-light);
    border: 1px solid var(--primary-blue) !important;
    border-right: none;
    border-radius: 6px 0 0 0;
    cursor: pointer;
    font-size: 20px;
    color: var(--primary-blue);
    padding: 0;
  }
  
  .shuffle-btn:hover {
    background: var(--primary-blue);
    color: white;
  }

  table { 
    width: 100%; 
    border-collapse: collapse; 
    table-layout: fixed; 
  }

  th { background-color: var(--bg-blue-light); padding: 12px; position: relative; }

  .sort-btn {
    background: none !important;
    border: none !important;
    color: var(--primary-blue);
    font-weight: bold;
    padding: 0;
    margin-left: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  
  /* 행에 상대 위치 부여 */
  tbody tr { 
    position: relative;
    height: 60px;
    cursor: move;
    transition: background-color 0.2s;
  }
  
  tbody tr:hover {
    background-color: rgba(109, 167, 242, 0.05);
  }
  
  tbody tr.dragging {
    opacity: 0.5;
  }
  
  tbody tr.drag-over {
    border-top: 3px solid var(--primary-blue);
  }

  td { 
    padding: 15px; 
    text-align: center; 
    word-break: break-all;
    vertical-align: middle;
    position: relative;
    background: white;
  }

  /* 가리기 상태 */
  .hidden { 
    color: transparent !important; 
    background-color: #f8f9fa !important;
    cursor: pointer;
  }
  .hidden::after {
    font-family: "bootstrap-icons";
    content: "\f33e";
    color: var(--primary-blue);
    font-size: 22px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    visibility: visible;
  }

  /* 왼쪽 북마크 아이콘 */
  .bookmark-icon {
    position: absolute;
    left: -118px;
    top: 0;
    bottom: 0;
    width: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    border: 1px solid var(--primary-blue);
    border-right: none;
    border-radius: 6px 0 0 6px;
    cursor: pointer;
    font-size: 24px;
    color: var(--bookmark-orange);
  }

  /* 북마크와 문장 사이에 위치하는 복습일 배지 */
  .due-badge {
    position: absolute;
    left: -68px;
    top: 0;
    bottom: 0;
    width: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-blue-light);
    border: 1px solid var(--primary-blue);
    font-size: 12px;
    font-weight: bold;
    color: var(--primary-blue);
  }
  .due-badge.overdue { color: white; background: var(--delete-red); border-color: var(--delete-red); }
  .due-badge.new { color: white; background: #9e9e9e; border-color: #9e9e9e; }

  /* 오른쪽 액션 아이콘 그룹 */
  .action-icons {
    position: absolute;
    right: -60px;
    top: 0;
    bottom: 0;
    width: 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: white;
    border: 1px solid var(--primary-blue);
    border-left: none;
    border-radius: 0 6px 6px 0;
    padding: 5px 0;
  }

  .btn-icon {
    background: none !important;
    border: none !important;
    padding: 0;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-edit { color: var(--primary-blue); }
  .btn-delete { color: var(--delete-red); }

  .file-ops { margin-top: 30px; display: flex; justify-content: space-between; }
  #csvInput { display: none; }
</style>
</head>
<body>

<h1>English Flashcards</h1>

<div class="controls">
  <button id="modeBtn" onclick="rotateMode()">둘 다 보기</button>
  <button class="start-btn" onclick="startGame()"><i class="bi bi-play-fill"></i> 게임 시작하기</button>
</div>

<div class="file-ops">
  <div>
    <button onclick="document.getElementById('csvInput').click()">CSV 불러오기</button>
    <input type="file" id="csvInput" accept=".csv" onchange="importCSV(event)">
  </div>
  <button onclick="exportCSV()" style="background-color: white;">CSV 다운로드</button>
</div>

<br>

<div class="input-row">
  <input id="sentenceInput" placeholder="영어 문장을 입력하세요">
  <input id="meaningInput" placeholder="뜻을 입력하세요">
  <button onclick="addRow()">등록</button>
</div>

<div class="table-container">
  <button class="shuffle-btn" onclick="shuffleRows()" title="카드 섞기">
    <i class="bi bi-shuffle"></i>
  </button>
  <table>
    <thead>
      <tr>
        <th style="width: 50%;">문장 <button class="sort-btn" onclick="toggleSort()" id="sortBtn">복습일순 정렬 ▲</button></th>
        <th style="width: 50%;">뜻</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
let cardData = JSON.parse(localStorage.getItem('flashcards')) || [];
let currentMode = Number(localStorage.getItem('flashcardMode')) || 0;
const modeLabels = ["둘 다 보기", "문장만 보기", "뜻만 보기"];
let sortAsc = true;

window.onload = function() {
  migrateData();
  document.getElementById('modeBtn').innerText = modeLabels[currentMode];
  renderTable();
};

function migrateData() {
  cardData.forEach(c => {
    if (c.interval === undefined) c.interval = null;
    if (c.dueDate === undefined) c.dueDate = null;
  });
  localStorage.setItem('flashcards', JSON.stringify(cardData));
}

function rotateMode() {
  currentMode = (currentMode + 1) % 3;
  localStorage.setItem('flashcardMode', currentMode);
  document.getElementById('modeBtn').innerText = `${modeLabels[currentMode]}`;
  renderTable();
}

function save() {
  localStorage.setItem('flashcards', JSON.stringify(cardData));
  renderTable();
}

function addRow() {
  const s = document.getElementById('sentenceInput').value.trim();
  const m = document.getElementById('meaningInput').value.trim();
  if(!s || !m) return alert("문장과 뜻을 모두 입력하세요.");
  
  cardData.push({ s, m, bookmarked: false, interval: null, dueDate: null });
  document.getElementById('sentenceInput').value = "";
  document.getElementById('meaningInput').value = "";
  save();
}

function toggleBookmark(idx) {
  cardData[idx].bookmarked = !cardData[idx].bookmarked;
  save();
}

function deleteRow(idx) {
  if(confirm("이 문장을 삭제할까요?")) {
    cardData.splice(idx, 1);
    save();
  }
}

function editRow(idx) {
  const newS = prompt("문장 수정:", cardData[idx].s);
  const newM = prompt("뜻 수정:", cardData[idx].m);
  if(newS && newM) {
    cardData[idx] = { ...cardData[idx], s: newS, m: newM };
    save();
  }
}

function toggleSort() {
  sortAsc = !sortAsc;
  document.getElementById('sortBtn').innerText = `복습일순 정렬 ${sortAsc ? '▲' : '▼'}`;
  cardData.sort((a, b) => {
    const da = a.dueDate ?? -Infinity; // 신규 카드는 가장 시급한 것으로 취급
    const db = b.dueDate ?? -Infinity;
    return sortAsc ? da - db : db - da;
  });
  save();
}

function formatDueDate(dueDate) {
  if (!dueDate) return { text: '신규', cls: 'new' };
  const diffMs = dueDate - Date.now();
  if (diffMs <= 0) return { text: '지금', cls: 'overdue' };
  const diffMin = Math.round(diffMs / 60000);
  if (diffMin < 60) return { text: `${diffMin}m`, cls: '' };
  const diffHour = Math.round(diffMin / 60);
  if (diffHour < 24) return { text: `${diffHour}h`, cls: '' };
  const diffDay = Math.round(diffHour / 24);
  if (diffDay < 30) return { text: `${diffDay}d`, cls: '' };
  const diffMonth = Math.round(diffDay / 30);
  return { text: `${diffMonth}mo`, cls: '' };
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = "";

  cardData.forEach((item, idx) => {
    const tr = document.createElement('tr');
    tr.draggable = true;
    tr.dataset.index = idx;
    
    // 드래그 이벤트 리스너
    tr.addEventListener('dragstart', handleDragStart);
    tr.addEventListener('dragover', handleDragOver);
    tr.addEventListener('drop', handleDrop);
    tr.addEventListener('dragend', handleDragEnd);
    
    const sClass = currentMode === 2 ? 'hidden' : '';
    const mClass = currentMode === 1 ? 'hidden' : '';
    const bookmarkIcon = item.bookmarked ? 'bi-bookmark-fill' : 'bi-bookmark';

    // 첫 번째 td에 북마크 아이콘 + 복습일 배지 추가
    const td1 = document.createElement('td');
    td1.className = sClass;
    td1.textContent = item.s;
    td1.onclick = function() { this.classList.remove('hidden'); };
    
    const bookmarkDiv = document.createElement('div');
    bookmarkDiv.className = 'bookmark-icon';
    bookmarkDiv.innerHTML = `<i class="bi ${bookmarkIcon}"></i>`;
    bookmarkDiv.onclick = () => toggleBookmark(idx);
    td1.appendChild(bookmarkDiv);

    const due = formatDueDate(item.dueDate);
    const dueDiv = document.createElement('div');
    dueDiv.className = `due-badge ${due.cls}`;
    dueDiv.textContent = due.text;
    td1.appendChild(dueDiv);

    // 두 번째 td
    const td2 = document.createElement('td');
    td2.className = mClass;
    td2.textContent = item.m;
    td2.onclick = function() { this.classList.remove('hidden'); };
    
    // 액션 아이콘 그룹 생성
    const actionsDiv = document.createElement('div');
    actionsDiv.className = 'action-icons';
    actionsDiv.innerHTML = `
      <button class="btn-icon btn-edit" onclick="editRow(${idx})"><i class="bi bi-pencil"></i></button>
      <button class="btn-icon btn-delete" onclick="deleteRow(${idx})"><i class="bi bi-x-circle"></i></button>
    `;
    td2.appendChild(actionsDiv);

    tr.appendChild(td1);
    tr.appendChild(td2);
    tbody.appendChild(tr);
  });
}

function exportCSV() {
  if (cardData.length === 0) return alert("데이터가 없습니다.");
  let csv = "\uFEFFSentence,Meaning,Bookmarked,Interval,DueDate\n";
  cardData.forEach(row => { 
    csv += `"${row.s}","${row.m}","${row.bookmarked || false}","${row.interval ?? ''}","${row.dueDate ?? ''}"\n`; 
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'flashcards.csv';
  a.click();
}

function importCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.split('\n').filter(l => l.trim() !== "").slice(1);
    const newData = lines.map(line => {
      const parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
      const clean = s => s ? s.replace(/"/g, '').trim() : "";
      const intervalStr = clean(parts[3]);
      const dueDateStr = clean(parts[4]);
      return { 
        s: clean(parts[0]), 
        m: clean(parts[1]),
        bookmarked: clean(parts[2]) === 'true',
        interval: intervalStr ? Number(intervalStr) : null,
        dueDate: dueDateStr ? Number(dueDateStr) : null
      };
    });
    if(confirm(`${newData.length}개의 데이터를 가져오시겠습니까?`)) {
      cardData = newData;
      save();
    }
  };
  reader.readAsText(file);
}

// 드래그 앤 드롭 관련 함수
let draggedIndex = null;

function handleDragStart(e) {
  draggedIndex = parseInt(e.currentTarget.dataset.index);
  e.currentTarget.classList.add('dragging');
}

function handleDragOver(e) {
  e.preventDefault();
  const afterElement = e.currentTarget;
  afterElement.classList.add('drag-over');
}

function handleDrop(e) {
  e.preventDefault();
  const dropIndex = parseInt(e.currentTarget.dataset.index);
  
  if (draggedIndex !== null && draggedIndex !== dropIndex) {
    const draggedItem = cardData[draggedIndex];
    cardData.splice(draggedIndex, 1);
    cardData.splice(dropIndex, 0, draggedItem);
    save();
  }
}

function handleDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('tbody tr').forEach(tr => {
    tr.classList.remove('drag-over');
  });
  draggedIndex = null;
}

function shuffleRows() {
  if (!confirm('카드 순서를 무작위로 섞을까요?')) return;
  
  for (let i = cardData.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cardData[i], cardData[j]] = [cardData[j], cardData[i]];
  }
  save();
}

function startGame() {
  if (cardData.length === 0) return alert("등록된 카드가 없습니다.");
  window.open('game.html', 'flashcardGame', 'width=560,height=640');
}

// game.html 팝업에서 복습 후 localStorage를 갱신하면 여기서 감지해서
// 메인 테이블(복습일 배지 등)을 자동으로 새로고침
window.addEventListener('storage', (e) => {
  if (e.key === 'flashcards' && e.newValue) {
    cardData = JSON.parse(e.newValue);
    renderTable();
  }
});
</script>

</body>
</html>
